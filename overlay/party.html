<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Loot Split</title>
  <div id="wsettings" class="wsettings">
    <div class="ws-sec">Saved splits</div>
    <div class="ws-row">
      <button id="saveBtn" class="hbtn" type="button" title="Save this split so you can come back to it after the ore is sold">⤓ Save</button>
    </div>
    <div class="ws-row">
      <button id="folderBtn" class="hbtn" type="button" title="Open the folder holding the saved .json and .txt files">↗ Folder</button>
    </div>
  </div>

<script>/* AMD compatibility: apply the lite skin BEFORE first paint (no flash) when the shell asks for it. */
  if (new URLSearchParams(location.search).has("lite")) document.documentElement.classList.add("amd-lite");
  /* Apply ?theme= before first paint (no flash). The parent canvas keeps this in sync live (same-origin). */
  { const q = new URLSearchParams(location.search); const r = document.documentElement;
    const t = q.get("theme"); if (t) r.setAttribute("data-theme", t); }</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/widget-theme.css" />
<style>
  /* Party roster + reward split. Theme tokens come from the shared /widget-theme.css.
     The roster is MANUAL — game.log can count party members but can't name them live
     (see src/party.ts) — so the log only contributes the detected size and name suggestions. */
  * { box-sizing: border-box; }
  * { scrollbar-width: thin; scrollbar-color: rgba(var(--accent-rgb), 0.28) transparent; }
  html, body { margin: 0; height: 100%; background: transparent; }
  body { font-family: var(--sans); color: var(--cyan-text); overflow: hidden; }

  #panel {
    display: flex; flex-direction: column;
    width: 360px; height: 500px; margin: 20px auto;
    border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
    background: linear-gradient(180deg, var(--panel-top), var(--panel-bot));
    -webkit-backdrop-filter: blur(9px); backdrop-filter: blur(9px);
    box-shadow: 0 10px 34px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(var(--accent-rgb), 0.05);
    position: relative;
  }
  html.amd-lite #panel { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; background: var(--panel-solid) !important; }
  /* Scanlines / Esperia mesh / Origin stitching come from the shared widget-theme.css
     via .wpanel, so every widget carries the theme's surface treatment. */
  body.embedded { overflow: visible; background: transparent; }
  body.embedded #panel { width: 100%; height: 100%; margin: 0; }

  .head { flex: none; display: flex; align-items: center; gap: 8px; padding: 9px 12px;
    border-bottom: 1px solid var(--divider); position: relative; z-index: 4; min-height: 40px; }
  .dia { width: 7px; height: 7px; flex: none; background: var(--cyan-bright); transform: rotate(45deg);
    box-shadow: 0 0 8px var(--cyan); }
  .hbtn { font-family: var(--sans); font-size: 11px; font-weight: 600; letter-spacing: 0.04em;
    color: var(--cyan-bright); background: rgba(var(--accent-rgb), 0.14); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 10px; cursor: pointer; white-space: nowrap; }
  .hbtn:hover { background: rgba(var(--accent-rgb), 0.24); border-color: var(--cyan); }
  .hbtn.sm { padding: 4px 7px; font-size: 10px; }

  /* Loot being divided. The game already splits mission aUEC, so what a crew actually divides is
     the PROCEEDS: SCU of ore, salvage, cargo. An optional unit price also reports what each
     share is WORTH, so people can be paid out before the ore is ever sold. */
  #loot { flex: none; border-bottom: 1px solid var(--divider); position: relative; z-index: 4; }
  .lhead { display: flex; align-items: center; gap: 6px; padding: 7px 12px 4px; }
  .lhead .lbl { flex: 1; font-size: 9px; font-weight: 700; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--faint); }
  .lrow { display: flex; align-items: center; gap: 5px; padding: 4px 12px 6px; }
  .lrow input { font-family: var(--sans); font-size: 11.5px; color: var(--cyan-bright);
    background: rgba(0, 0, 0, 0.25); border: 1px solid var(--divider); border-radius: 5px;
    padding: 3px 6px; outline: none; min-width: 0; }
  .lrow input:focus { border-color: var(--cyan); }
  .lrow input.ln { flex: 1; }
  .lrow input.lq { width: 58px; font-family: var(--mono); text-align: right; }
  .lrow input.lu { width: 46px; }
  .lrow input.lp { width: 68px; font-family: var(--mono); text-align: right; }
  .lrow .lx { flex: none; background: transparent; border: 0; color: var(--faint); cursor: pointer;
    font-size: 11px; padding: 2px 3px; border-radius: 4px; }
  .lrow .lx:hover { color: var(--red); background: rgba(255, 132, 120, 0.12); }

  .lprice { display: flex; gap: 4px; flex-wrap: wrap; padding: 0 12px 6px 12px; }
  .lprice .pc { font-family: var(--mono); font-size: 9.5px; font-weight: 600; color: var(--cyan-text);
    background: rgba(var(--accent-rgb), 0.1); border: 1px solid var(--divider); border-radius: 4px;
    padding: 2px 6px; cursor: pointer; }
  .lprice .pc:hover { border-color: var(--cyan); color: var(--cyan-bright); }
  .lprice .pn { font-size: 9.5px; color: var(--faint); padding: 2px 0; }
  .sec2 { flex: none; border-top: 1px solid var(--divider); position: relative; z-index: 4; }
  .row .lootcut { flex-basis: 100%; font-family: var(--mono); font-size: 10px; color: var(--cyan-dim);
    padding: 2px 0 0 2px; }
  .row .lootcut:empty { display: none; }

  /* Pot being split — the tracked/last mission's payout and the session total. */
  .pot { flex: none; display: flex; gap: 0; border-bottom: 1px solid var(--divider); position: relative; z-index: 4; }
  .pot > div { flex: 1; padding: 8px 12px; }
  .pot > div + div { border-left: 1px solid var(--divider); }
  .pot .k { font-size: 9px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); }
  .pot .v { font-family: var(--mono); font-size: 15px; font-weight: 600; color: var(--gold); margin-top: 2px; }
  .pot .v.dim { color: var(--faint); }
  .pot .sel { outline: 1px solid rgba(var(--accent-rgb), 0.5); outline-offset: -1px; }
  .pot > div { cursor: pointer; }
  .pot > div:hover { background: rgba(var(--accent-rgb), 0.07); }

  /* Detected-party nudge — the one thing the log genuinely knows. */
  .nudge { flex: none; font-size: 10.5px; line-height: 1.5; color: var(--cyan-dim);
    padding: 7px 12px; border-bottom: 1px solid var(--divider); position: relative; z-index: 4; }
  .nudge b { color: var(--cyan-bright); }
  .nudge.warn b { color: var(--amber); }

  /* Roster */
  #list { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; z-index: 4; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 7px 12px;
    border-bottom: 1px solid rgba(var(--accent-rgb), 0.08); }
  .row input.nm { border-bottom: 1px solid var(--divider); }
  .row input.nm { flex: 1; min-width: 0; font-family: var(--sans); font-size: 12.5px; font-weight: 600;
    color: var(--cyan-bright); background: transparent; border: 0; border-bottom: 1px solid transparent;
    outline: none; padding: 2px 0; }
  .row input.nm:focus { border-bottom-color: var(--cyan); }
  .row input.sh { width: 46px; flex: none; font-family: var(--mono); font-size: 12px; text-align: right;
    color: var(--cyan-text); background: rgba(0, 0, 0, 0.25); border: 1px solid var(--divider);
    border-radius: 5px; padding: 3px 5px; outline: none; }
  .row input.sh:focus { border-color: var(--cyan); }
  .row .pct { font-size: 10px; color: var(--faint); flex: none; }
  .row .cut { width: 78px; flex: none; text-align: right; font-family: var(--mono); font-size: 12.5px;
    font-weight: 600; color: var(--gold); }
  .row .cut.dim { color: var(--faint); font-weight: 500; }
  .row .del { flex: none; background: transparent; border: 0; color: var(--faint); cursor: pointer;
    font-size: 12px; padding: 2px 4px; border-radius: 4px; }
  .row .del:hover { color: var(--red); background: rgba(255, 132, 120, 0.12); }
  .empty { padding: 22px 16px; text-align: center; color: var(--faint); font-size: 12px; line-height: 1.7; }

  /* Suggestions harvested from the log. */
  #sugg { flex: none; display: none; gap: 5px; flex-wrap: wrap; padding: 8px 12px;
    border-top: 1px solid var(--divider); position: relative; z-index: 4; }
  #sugg.show { display: flex; }
  #sugg .lbl { width: 100%; font-size: 9px; font-weight: 700; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--faint); }
  .chip { font-family: var(--sans); font-size: 11px; font-weight: 600; color: var(--cyan-text);
    background: rgba(var(--accent-rgb), 0.1); border: 1px solid var(--divider); border-radius: 999px;
    padding: 3px 9px; cursor: pointer; }
  .chip:hover { border-color: var(--cyan); color: var(--cyan-bright); background: rgba(var(--accent-rgb), 0.2); }

  .foot { flex: none; display: flex; align-items: center; gap: 7px; padding: 8px 12px;
    border-top: 1px solid var(--divider); position: relative; z-index: 4; }
  .foot .tot { flex: 1; font-family: var(--mono); font-size: 10.5px; color: var(--faint); }
  .foot .tot.bad { color: var(--amber); }

  /* Saved splits. A crew often cannot settle up until the ore is refined and sold days later,
     so a split has to survive the app closing - each save also writes a plain-text twin on disk. */
  #saved { flex: none; display: none; flex-direction: column; max-height: 44%;
    border-top: 1px solid var(--divider); position: relative; z-index: 4; }
  #saved.show { display: flex; }
  #saved .shead { display: flex; align-items: center; gap: 6px; padding: 7px 12px 5px; }
  #saved .shead .lbl { flex: 1; font-size: 9px; font-weight: 700; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--faint); }
  #slist { overflow-y: auto; }
  .srow { display: flex; align-items: center; gap: 7px; padding: 6px 12px;
    border-top: 1px solid rgba(var(--accent-rgb), 0.07); }
  .srow .si { flex: 1; min-width: 0; cursor: pointer; }
  .srow .sl { font-size: 12px; font-weight: 600; color: var(--cyan-bright);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .srow .sm { font-family: var(--mono); font-size: 9.5px; color: var(--faint); margin-top: 1px; }
  .srow .sp { flex: none; font-family: var(--mono); font-size: 11.5px; font-weight: 600; color: var(--gold); }
  .srow .sx { flex: none; background: transparent; border: 0; color: var(--faint); cursor: pointer;
    font-size: 11px; padding: 2px 4px; border-radius: 4px; }
  .srow .sx:hover { color: var(--red); background: rgba(255, 132, 120, 0.12); }
</style>
</head>
<body>
  <div id="panel" class="wpanel">
    <div class="head">
      <span class="dia"></span>
      <span class="h-title">Party Split</span>
      <button id="typeBtn" class="hbtn sm" type="button" title="Typing mode: grab keyboard focus so you can type in-game">✎ Type mode</button>
    </div>

    <div class="pot">
      <div id="potMission" title="Split the last completed mission's payout"><div class="k">Last mission</div><div class="v" id="potMissionV">—</div></div>
      <div id="potSession" title="Split everything earned this session"><div class="k">Session</div><div class="v" id="potSessionV">—</div></div>
    </div>

    <div id="loot">
      <div class="lhead">
        <span class="lbl">What you're splitting</span>
        <button id="lootAdd" class="hbtn sm" type="button" title="Add ore, salvage or cargo to divide">＋ Item</button>
      </div>
      <div id="lootRows"></div>
    </div>

    <div class="nudge" id="nudge"></div>

    <div class="lhead sec2">
      <span class="lbl">Who is splitting</span>
      <button id="addBtn" class="hbtn sm" type="button" title="Add a party member">＋ Member</button>
    </div>
    <div id="list"></div>
    <div class="empty" id="emptyState">No one in the roster yet.<br>Tap <b>＋ Member</b> or pick a name below.</div>

    <div id="sugg"><span class="lbl">Played with before</span></div>

    <div class="foot">
      <span class="tot" id="tot"></span>
      <button id="listBtn" class="hbtn sm" type="button" title="Show saved splits">Saved</button>
      <button id="evenBtn" class="hbtn sm" type="button" title="Split evenly across everyone">Even split</button>
    </div>

    <div id="saved">
      <div class="shead">
        <span class="lbl">Saved splits</span>
      </div>
      <div id="slist"></div>
    </div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const EMBEDDED = new URLSearchParams(location.search).has("embedded");
  if (EMBEDDED) document.body.classList.add("embedded");
  // Same-origin bridge to the parent canvas (present only when embedded on the overlay).
  const host = () => (EMBEDDED && window.parent) ? window.parent.__partyHost : null;

  const POLL_MS = 5000;

  let members = [];        // [{ id, name, share }]
  let detected = 0;        // party markers the game currently has streamed in
  let suggestions = [];
  let pot = { mission: null, session: null };
  let loot = [];           // [{ id, name, qty, unit, pricePerUnit }] — the goods being divided
  let sessions = [];       // saved splits (newest first)
  let self = "";           // the player's own handle, read from the log
  let seededSelf = false;  // only ever pre-fill yourself once
  let showSaved = false;
  let basis = "mission";   // which pot the cuts are computed from
  let saveTimer = null;

  const newId = () => (crypto.randomUUID ? crypto.randomUUID().slice(0, 8) : Math.random().toString(36).slice(2, 10));
  const fmtAUEC = (n) => n == null ? "—" : Math.round(n).toLocaleString() + " aUEC";
  const totalShare = () => members.reduce((s, m) => s + (Number(m.share) || 0), 0);

  // ── persistence ─────────────────────────────────────────────────────────────
  async function save() {
    try {
      const r = await fetch("/api/party", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ members }),
      });
      const v = await r.json();
      suggestions = v.suggestions || [];
    } catch { /* best-effort */ }
  }
  function scheduleSave() { clearTimeout(saveTimer); saveTimer = setTimeout(save, 500); }

  async function pollParty() {
    try {
      const v = await (await fetch("/api/party", { cache: "no-store" })).json();
      detected = v.detected || 0;
      suggestions = v.suggestions || [];
      sessions = v.sessions || [];
      self = v.self || "";
      // You're always in your own party, so don't make the user type their own handle. Seeded
      // ONCE (tracked by a flag, not by "is the roster empty") so removing yourself sticks —
      // some people don't want a cut and deliberately take themselves out of the pool.
      if (self && !seededSelf && !members.length) {
        seededSelf = true;
        members = [{ id: newId(), name: self, share: 100 }];
        renderRows(); save();
      }
      if (self) seededSelf = true;
      // Don't clobber in-progress edits — the roster is owned by this widget once loaded.
      if (!members.length && (v.members || []).length) members = v.members;
    } catch { /* sidecar restarting */ }
    renderChrome();
  }

  // The pot being split: the newest completed mission's payout, and the sum over the current
  // grind session. Both come from the mission view's history (aUEC is the logged award, or the
  // mission's FIXED dataset payout — calculated-reward missions log nothing, so they stay null).
  async function pollPot() {
    try {
      const v = await (await fetch("/api/missions", { cache: "no-store" })).json();
      const recent = v.recentMissions || [];
      pot.mission = recent.length && recent[0].aUEC != null ? recent[0].aUEC : null;
      const known = recent.filter((m) => m.aUEC != null);
      pot.session = known.length ? known.reduce((s, m) => s + m.aUEC, 0) : null;
    } catch { /* leave the last known pot */ }
    renderChrome();
  }

  // ── rendering ───────────────────────────────────────────────────────────────
  function potValue() { return basis === "session" ? pot.session : pot.mission; }

  function renderRows() {
    const list = $("list");
    list.textContent = "";
    $("emptyState").style.display = members.length ? "none" : "block";
    const p = potValue();
    for (const m of members) {
      const row = document.createElement("div");
      row.className = "row";

      const nm = document.createElement("input");
      nm.className = "nm"; nm.type = "text"; nm.value = m.name; nm.maxLength = 40;
      nm.spellcheck = false; nm.placeholder = "Handle";
      nm.addEventListener("input", () => { m.name = nm.value; scheduleSave(); });
      if (self && m.name.toLowerCase() === self.toLowerCase()) nm.title = "This is you";

      const sh = document.createElement("input");
      sh.className = "sh"; sh.type = "number"; sh.min = "0"; sh.max = "100"; sh.value = String(m.share);
      sh.addEventListener("input", () => {
        m.share = Math.max(0, Math.min(100, Number(sh.value) || 0));
        renderCuts(); renderTotal(); scheduleSave();
      });

      const pct = document.createElement("span");
      pct.className = "pct"; pct.textContent = "%";

      const cut = document.createElement("span");
      cut.className = "cut" + (p == null ? " dim" : "");
      cut.dataset.for = m.id;
      cut.textContent = p == null ? "—" : fmtAUEC(p * (Number(m.share) || 0) / 100);

      const del = document.createElement("button");
      del.className = "del"; del.type = "button"; del.title = "Remove"; del.textContent = "✕";
      del.addEventListener("click", () => {
        members = members.filter((x) => x.id !== m.id);
        renderRows(); renderTotal(); save();
      });

      row.append(nm, sh, pct, cut, del);
      const lc = document.createElement("div");
      lc.className = "lootcut"; lc.dataset.lootFor = m.id;
      row.appendChild(lc);
      list.appendChild(row);
    }
  }
  // Cheap update of just the money column (share edits shouldn't rebuild inputs mid-typing).
  function renderCuts() {
    const p = potValue();
    for (const m of members) {
      const el = document.querySelector('.cut[data-for="' + m.id + '"]');
      if (el) {
        el.classList.toggle("dim", p == null);
        el.textContent = p == null ? "—" : fmtAUEC(p * (Number(m.share) || 0) / 100);
      }
      // …and their share of every loot line, with its cash value when a unit price is set.
      const lc = document.querySelector('.lootcut[data-loot-for="' + m.id + '"]');
      if (!lc) continue;
      const share = (Number(m.share) || 0) / 100;
      const parts = loot.filter((l) => l.name && l.qty > 0).map((l) => {
        const q = Math.round(l.qty * share * 100) / 100;
        const v = l.pricePerUnit != null ? "  (" + fmtAUEC(q * l.pricePerUnit) + ")" : "";
        return q + " " + l.unit + " " + l.name + v;
      });
      lc.textContent = parts.join("   ·   ");
    }
  }
  function renderTotal() {
    const t = Math.round(totalShare() * 10) / 10;
    const el = $("tot");
    el.textContent = members.length ? "shares total " + t + "%" : "";
    el.classList.toggle("bad", members.length > 0 && Math.abs(t - 100) > 0.05);
  }
  function renderChrome() {
    // Pot readouts + which one is selected.
    $("potMissionV").textContent = fmtAUEC(pot.mission);
    $("potMissionV").classList.toggle("dim", pot.mission == null);
    $("potSessionV").textContent = fmtAUEC(pot.session);
    $("potSessionV").classList.toggle("dim", pot.session == null);
    $("potMission").classList.toggle("sel", basis === "mission");
    $("potSession").classList.toggle("sel", basis === "session");

    // The detected-vs-named nudge — the log knows the COUNT, never the names.
    const n = $("nudge");
    const named = members.length;
    if (detected > 0) {
      n.textContent = "";
      const b1 = document.createElement("b"); b1.textContent = detected + " party member" + (detected === 1 ? "" : "s");
      n.append(b1, document.createTextNode(" detected in-game · " + named + " in the roster"));
      n.classList.toggle("warn", named !== detected);
    } else {
      n.textContent = named ? "No party detected right now — the roster is kept anyway." : "No party detected. Add names to split rewards.";
      n.classList.remove("warn");
    }

    // Suggestions: handles the log has actually named, minus anyone already rostered.
    const s = $("sugg");
    const have = new Set(members.map((m) => m.name.toLowerCase()));
    const show = suggestions.filter((x) => !have.has(x.toLowerCase())).slice(0, 8);
    for (const c of [...s.querySelectorAll(".chip")]) c.remove();
    s.classList.toggle("show", show.length > 0);
    for (const name of show) {
      const c = document.createElement("button");
      c.type = "button"; c.className = "chip"; c.textContent = name;
      c.addEventListener("click", () => addMember(name));
      s.appendChild(c);
    }
    renderCuts();
    renderTotal();
    renderSaved();
  }

  function addMember(name) {
    if (members.length >= 12) return;
    members.push({ id: newId(), name: name || "", share: 0 });
    evenSplit();               // a new member with 0% is useless; rebalance by default
    renderRows(); renderChrome(); save();
  }
  function evenSplit() {
    if (!members.length) return;
    // Whole percents, with the remainder handed to the first member so it totals exactly 100.
    const base = Math.floor(100 / members.length);
    members.forEach((m) => { m.share = base; });
    members[0].share += 100 - base * members.length;
  }

  // ---- saved splits ---------------------------------------------------------
  function renderSaved() {
    $("saved").classList.toggle("show", showSaved);
    $("listBtn").classList.toggle("active", showSaved);
    const list = $("slist");
    list.textContent = "";
    if (!sessions.length) {
      const d = document.createElement("div");
      d.className = "empty";
      d.textContent = "Nothing saved yet.";
      list.appendChild(d);
      return;
    }
    for (const s of sessions) {
      const row = document.createElement("div");
      row.className = "srow";
      const si = document.createElement("div");
      si.className = "si";
      si.title = "Load this split back into the roster";
      const sl = document.createElement("div"); sl.className = "sl"; sl.textContent = s.label;
      const sm = document.createElement("div"); sm.className = "sm";
      sm.textContent = new Date(s.savedAt).toLocaleString() + "  \u00b7  " + s.members + " member" + (s.members === 1 ? "" : "s");
      si.append(sl, sm);
      si.addEventListener("click", () => loadSession(s.id));
      const sp = document.createElement("div"); sp.className = "sp";
      sp.textContent = s.pot != null ? Math.round(s.pot).toLocaleString() : "\u2014";
      const sx = document.createElement("button");
      sx.className = "sx"; sx.type = "button"; sx.title = "Delete"; sx.textContent = "\u2715";
      sx.addEventListener("click", (e) => { e.stopPropagation(); deleteSession(s.id); });
      row.append(si, sp, sx);
      list.appendChild(row);
    }
  }
  async function saveSession() {
    if (!members.length) return;
    const label = (potValue() != null ? (basis === "session" ? "Session total" : "Last mission") : "Split") +
      " \u00b7 " + new Date().toLocaleDateString([], { month: "short", day: "numeric" });
    try {
      const r = await fetch("/api/party/sessions", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ label, members, loot, pot: potValue(), potLabel: basis === "session" ? "Session total" : "Last mission" }),
      });
      const d = await r.json();
      sessions = d.view?.sessions || sessions;
      showSaved = true;
      renderSaved();
    } catch { /* best-effort */ }
  }
  async function loadSession(id) {
    try {
      const s = await (await fetch("/api/party/session?id=" + encodeURIComponent(id), { cache: "no-store" })).json();
      if (!s || s.error) return;
      members = (s.members || []).map((m) => ({ id: m.id, name: m.name, share: m.share }));
      loot = (s.loot || []).map((l) => ({ ...l }));
      renderLoot(); renderRows(); renderChrome(); save();
    } catch { /* ignore */ }
  }
  async function deleteSession(id) {
    try {
      const d = await (await fetch("/api/party/session?id=" + encodeURIComponent(id), { method: "DELETE" })).json();
      sessions = d.view?.sessions || sessions.filter((x) => x.id !== id);
      renderSaved();
    } catch { /* ignore */ }
  }

  // ---- loot ------------------------------------------------------------------
  function renderLoot() {
    const wrap = $("lootRows");
    wrap.textContent = "";
    for (const l of loot) {
      const row = document.createElement("div");
      row.className = "lrow";
      const mk = (cls, val, ph, on, type) => {
        const i = document.createElement("input");
        i.className = cls; i.value = val == null ? "" : val; i.placeholder = ph;
        i.spellcheck = false;
        if (type) { i.type = type; i.min = "0"; i.step = "any"; }
        i.addEventListener("input", () => { on(i.value); renderCuts(); scheduleSave(); });
        return i;
      };
      row.append(
        mk("ln", l.name, "Aluminum", (v) => { l.name = v; }),
        mk("lq", l.qty, "0", (v) => { l.qty = Math.max(0, Number(v) || 0); }, "number"),
        mk("lu", l.unit, "SCU", (v) => { l.unit = v; }),
        mk("lp", l.pricePerUnit, "aUEC/ea", (v) => { l.pricePerUnit = v === "" ? null : Math.max(0, Number(v) || 0); }, "number"),
      );
      // Sell-price lookup, straight from the bundled commodity data (no UEX call, works offline).
      const money = document.createElement("button");
      money.className = "lx"; money.type = "button"; money.title = "Look up sell prices";
      money.textContent = "¤";
      const priceBar = document.createElement("div");
      priceBar.className = "lprice";
      money.addEventListener("click", async () => {
        priceBar.textContent = "";
        const note = document.createElement("span"); note.className = "pn";
        if (!l.name.trim()) { note.textContent = "name it first"; priceBar.append(note); return; }
        note.textContent = "looking up…"; priceBar.append(note);
        try {
          const r = await fetch("/api/commodity-price?name=" + encodeURIComponent(l.name.trim()));
          const d = await r.json();
          priceBar.textContent = "";
          if (d.error || !d.quotes) {
            const n2 = document.createElement("span"); n2.className = "pn";
            n2.textContent = "no sell price for “" + l.name + "”";
            priceBar.append(n2); return;
          }
          const lbl = document.createElement("span"); lbl.className = "pn";
          lbl.textContent = d.name + " · " + d.quotes + " terminals:";
          priceBar.append(lbl);
          for (const [k, v] of [["low", d.low], ["avg", d.avg], ["high", d.high]]) {
            const c = document.createElement("button");
            c.type = "button"; c.className = "pc";
            c.textContent = k + " " + Number(v).toLocaleString();
            c.title = "Use " + k + " as the per-unit price";
            c.addEventListener("click", () => {
              l.pricePerUnit = v;
              renderLoot(); renderCuts(); scheduleSave();
            });
            priceBar.append(c);
          }
        } catch {
          priceBar.textContent = "";
          const n3 = document.createElement("span"); n3.className = "pn"; n3.textContent = "lookup failed";
          priceBar.append(n3);
        }
      });
      row.append(money);
      const x = document.createElement("button");
      x.className = "lx"; x.type = "button"; x.title = "Remove"; x.textContent = "✕";
      x.addEventListener("click", () => { loot = loot.filter((y) => y.id !== l.id); renderLoot(); renderRows(); scheduleSave(); });
      row.append(x);
      wrap.appendChild(row);
      wrap.appendChild(priceBar);
    }
  }
  $("lootAdd").addEventListener("click", () => {
    loot.push({ id: newId(), name: "", qty: 0, unit: "SCU", pricePerUnit: null });
    renderLoot(); renderRows();
  });

  $("saveBtn").addEventListener("click", saveSession);
  $("listBtn").addEventListener("click", () => { showSaved = !showSaved; renderSaved(); });
  $("folderBtn").addEventListener("click", () => { try { host()?.openFolder?.(); } catch { /* not embedded */ } });
  $("addBtn").addEventListener("click", () => addMember(""));
  $("evenBtn").addEventListener("click", () => { evenSplit(); renderRows(); renderChrome(); save(); });
  $("potMission").addEventListener("click", () => { basis = "mission"; renderChrome(); });
  $("potSession").addEventListener("click", () => { basis = "session"; renderChrome(); });

  // Typing mode — the shell grabs keyboard focus + suspends the interact key so the roster can be
  // edited over a focused game (shared with the Notepad widget; see main.cjs).
  let typing = false;
  function setTyping(on) {
    typing = !!on;
    const b = $("typeBtn");
    b.textContent = typing ? "✓ Done" : "✎ Type mode";
    if (typing) { if (host()) host().editStart(); else focusFirst(); }
    else { if (host()) host().editEnd(); const a = document.activeElement; if (a && a.blur) a.blur(); }
  }
  function focusFirst() {
    const el = document.querySelector('.row input.nm:placeholder-shown') || document.querySelector(".row input.nm");
    if (el) el.focus();
  }
  window.__partyFocus = () => { if (typing) focusFirst(); };
  window.__partyExitTyping = () => { if (typing) setTyping(false); };
  $("typeBtn").addEventListener("click", () => setTyping(!typing));
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && typing) { e.preventDefault(); setTyping(false); } });

  // Any interaction summons the parent's global cog (settings/arrange reachable), matching mining.
  document.addEventListener("pointerdown", () => { try { host()?.summonCog?.(); } catch { /* not embedded */ } });

  (async () => {
    await pollParty();
    renderLoot();
    renderRows();
    await pollPot();
  })();
  setInterval(pollParty, POLL_MS);
  setInterval(pollPot, POLL_MS * 2);
  try { host()?.ready?.(); } catch { /* not embedded */ }
  // Per-widget settings, opened by the bar's cog. Controls that used to crowd the header live
  // here; the parent injects its Text size row into this same sheet.
  window.__widgetSettings = () => $("wsettings").classList.add("open");
  window.__widgetSettingsRoot = () => $("wsettings");
  document.addEventListener("click", (e) => {
    if (!e.target.closest("#wsettings")) $("wsettings").classList.remove("open");
  });
</script>
</body>
</html>
