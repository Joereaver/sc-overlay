<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chat</title>
<script>/* AMD compatibility: apply the lite skin BEFORE first paint (no flash) when the shell asks for it. */
  if (new URLSearchParams(location.search).has("lite")) document.documentElement.classList.add("amd-lite");
  /* Apply ?theme= before first paint (no flash). The parent canvas keeps this in sync live (same-origin). */
  { const q = new URLSearchParams(location.search); const r = document.documentElement;
    const t = q.get("theme"); if (t) r.setAttribute("data-theme", t); }</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/widget-theme.css" />
<style>
  /* Three panes, EVE's structure in OUR skin (Sub's spec, 2026-08-09):
       LEFT   channel browser — what you could join, plus Join/Create
       CENTER tabs + messages + send
       RIGHT  who is in the channel you are looking at
     Both rails collapse; the collapsed state is remembered. Everything here is themed from
     /widget-theme.css — no EVE colours, no EVE chrome. */
  * { box-sizing: border-box; }
  * { scrollbar-width: thin; scrollbar-color: rgba(var(--accent-rgb), 0.28) transparent; }
  html, body { margin: 0; height: 100%; background: transparent; }
  body { font-family: var(--sans); color: var(--cyan-text); overflow: hidden; }
  [hidden] { display: none !important; }

  #panel {
    display: flex; flex-direction: column;
    width: 820px; height: 480px; margin: 20px auto;
    border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
    background: linear-gradient(180deg, var(--panel-top), var(--panel-bot));
    -webkit-backdrop-filter: blur(9px); backdrop-filter: blur(9px);
    box-shadow: 0 10px 34px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(var(--accent-rgb), 0.05);
    position: relative;
  }
  html.amd-lite #panel { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; background: var(--panel-solid) !important; }
  body.embedded { overflow: visible; background: transparent; }
  body.embedded #panel { width: 100%; height: 100%; margin: 0; }

  /* ── the three-pane body ───────────────────────────────────────────────── */
  #body { flex: 1; min-height: 0; display: flex; position: relative; z-index: 4; }
  .rail { flex: none; display: flex; flex-direction: column; min-height: 0;
    background: rgba(0, 0, 0, 0.16); }
  #left { width: 190px; border-right: 1px solid var(--divider); }
  #right { width: 168px; border-left: 1px solid var(--divider); }
  #panel.no-left #left, #panel.no-right #right { display: none; }
  #center { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  .rail-head { flex: none; display: flex; align-items: center; gap: 6px; padding: 7px 9px;
    border-bottom: 1px solid var(--divider);
    font-size: 8.5px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: var(--faint); }
  .rail-head .n { margin-left: auto; color: var(--gold); letter-spacing: 0.06em; }
  .rail-body { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 0; }

  /* left rail: group headings + rows you can join */
  .grp { padding: 8px 10px 3px; font-size: 8.5px; font-weight: 800; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--faint); }
  .crow { display: flex; align-items: center; gap: 6px; padding: 4px 10px; cursor: pointer;
    font-size: 11.5px; color: var(--cyan-text); }
  .crow:hover { background: rgba(var(--accent-rgb), 0.1); }
  .crow.on { color: var(--cyan-bright); background: rgba(var(--accent-rgb), 0.14); }
  .crow .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .crow .ct { flex: none; font-size: 10px; color: var(--gold); }
  .crow .x { flex: none; opacity: 0; font-size: 11px; color: var(--faint); padding: 0 2px; }
  .crow:hover .x { opacity: 1; }
  .crow .x:hover { color: var(--red, #ff6b5e); }
  .empty { padding: 8px 10px; font-size: 10.5px; font-style: italic; color: var(--faint); line-height: 1.5; }

  /* left rail: the join/create form */
  .rail-foot { flex: none; border-top: 1px solid var(--divider); padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  #chanInput { font-family: var(--sans); font-size: 11.5px; color: var(--cyan-bright);
    background: rgba(0, 0, 0, 0.25); border: 1px solid var(--divider); border-radius: 6px;
    padding: 5px 7px; outline: none; width: 100%; }
  #chanInput:focus { border-color: var(--cyan); }
  #chanInput::placeholder { color: var(--faint); }
  .rail-foot .row { display: flex; gap: 6px; }
  .rail-foot .row .hbtn { flex: 1; text-align: center; }

  /* centre: tab strip */
  #tabs { flex: none; display: flex; align-items: stretch; gap: 3px; padding: 6px 8px 0;
    overflow-x: auto; overflow-y: hidden; border-bottom: 1px solid var(--divider); }
  .tab { font-family: var(--sans); font-size: 10.5px; font-weight: 700; letter-spacing: 0.03em;
    color: var(--cyan-dim); background: rgba(var(--accent-rgb), 0.07);
    border: 1px solid var(--divider); border-bottom: none; border-radius: 6px 6px 0 0;
    padding: 5px 9px; cursor: pointer; white-space: nowrap; position: relative; }
  .tab:hover { background: rgba(var(--accent-rgb), 0.16); }
  .tab.active { color: var(--cyan-bright); background: rgba(var(--accent-rgb), 0.22); border-color: var(--cyan); }
  .tab .unread { position: absolute; top: -3px; right: -3px; width: 7px; height: 7px; border-radius: 50%;
    background: var(--gold); box-shadow: 0 0 6px var(--gold); }

  #log { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden;
    padding: 6px 0; font-size: 12.5px; line-height: 1.5; }
  .msg { padding: 3px 12px; word-wrap: break-word; overflow-wrap: anywhere; }
  .msg:hover { background: rgba(var(--accent-rgb), 0.05); }
  .msg .nm { font-weight: 700; }
  .msg .vf { display: inline-block; font-size: 8px; font-weight: 800; vertical-align: 2px; margin-left: 2px;
    color: var(--green, #38d980); }
  .msg .sep { color: var(--faint); margin-right: 3px; }
  .msg .tx { color: var(--cyan-text); }
  .msg .ts { float: right; margin-left: 6px; font-size: 9.5px; color: var(--faint); }
  .sys { padding: 3px 12px; font-size: 11px; color: var(--faint); font-style: italic; }
  /* A message that names YOU gets a gold edge — findable when you scroll back, quiet when
     you don't. Mentions of anyone else are just a tinted token. */
  .msg.mention { background: rgba(var(--accent-rgb), 0.10); box-shadow: inset 3px 0 0 var(--gold); }
  .msg .at { color: var(--cyan-bright); font-weight: 600; }
  .msg.mention .at.me { color: var(--gold); }
  /* A link out of chat — a blueprint on the site, or an item on starcitizen.tools. */
  .msg .lk { color: var(--gold); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
  .msg .lk:hover { filter: brightness(1.2); }
  /* Friends float to the top of the member list and keep a marker. */
  .mrow .fav { flex: none; font-size: 9px; color: var(--gold); }

  /* Right-click menu on a name (member list or message). */
  #ctx { position: absolute; display: none; z-index: 8; min-width: 150px; padding: 4px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--panel-solid, rgba(10,20,28,.98));
    box-shadow: 0 12px 30px rgba(0,0,0,.55); }
  #ctx.open { display: block; }
  #ctx .ct-who { padding: 5px 8px 6px; font-size: 10px; font-weight: 700; letter-spacing: .06em;
    color: var(--gold); border-bottom: 1px solid var(--divider); margin-bottom: 3px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #ctx button { display: block; width: 100%; text-align: left; font-family: var(--sans); font-size: 11.5px;
    color: var(--cyan-text); background: none; border: 0; border-radius: 5px; padding: 6px 8px; cursor: pointer; }
  #ctx button:hover { background: rgba(var(--accent-rgb), 0.18); color: var(--cyan-bright); }

  /* One suggestion list, three jobs: commands (/), people (@) and blueprint names. Sub asked
     for autocomplete because "I don't know exactly what to type" — so nothing here should ever
     require knowing a name in advance. ↑↓ to move, Tab/Enter to accept, Esc to dismiss. */
  #slash { position: absolute; bottom: calc(100% + 6px); left: 10px; right: 10px; display: none;
    z-index: 6; padding: 5px; border: 1px solid var(--border); border-radius: 8px; max-height: 190px;
    overflow-y: auto; background: var(--panel-solid, rgba(10,20,28,.98)); box-shadow: 0 12px 30px rgba(0,0,0,.5); }
  #slash.open { display: block; }
  #slash .sc-row { display: flex; gap: 8px; align-items: baseline; padding: 4px 7px; border-radius: 5px; cursor: pointer; font-size: 11.5px; }
  #slash .sc-row:hover, #slash .sc-row.on { background: rgba(var(--accent-rgb), 0.18); }
  #slash .sc-cmd { font-family: var(--mono); color: var(--cyan-bright); font-weight: 700; }
  #slash .sc-name { color: var(--cyan-text); font-weight: 600; }
  #slash .sc-hint { color: var(--faint); font-size: 10.5px; margin-left: auto; }

  #sendbar { flex: none; display: flex; gap: 6px; padding: 8px 10px; border-top: 1px solid var(--divider); position: relative; }

  /* Emoji: rendered by the OS font (Segoe UI Emoji on Windows), so there is nothing to
     download and nothing to host. This picker exists because Windows' own Win+. panel is
     unreliable over a fullscreen game — and typing :shortcodes: beats hunting a grid anyway. */
  #emojiPop { position: absolute; bottom: calc(100% + 6px); right: 10px; width: 244px; max-height: 210px;
    overflow-y: auto; display: none; z-index: 6; padding: 6px;
    border: 1px solid var(--border); border-radius: 9px;
    background: var(--panel-solid, rgba(10, 20, 28, 0.98));
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55); }
  #emojiPop.open { display: block; }
  #emojiPop .egrp { padding: 4px 4px 2px; font-size: 8.5px; font-weight: 800; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--faint); }
  #emojiPop .erow { display: flex; flex-wrap: wrap; gap: 1px; }
  #emojiPop button { font-size: 17px; line-height: 1; background: none; border: 0; border-radius: 5px;
    padding: 4px; cursor: pointer;
    font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif; }
  #emojiPop button:hover { background: rgba(var(--accent-rgb), 0.22); }
  /* Emoji in a message want a touch more size than the surrounding text to read at all. */
  .msg .tx { font-family: var(--sans), "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji"; }
  #sendInput { flex: 1; min-width: 0; font-family: var(--sans); font-size: 12px; color: var(--cyan-bright);
    background: rgba(0, 0, 0, 0.25); border: 1px solid var(--divider); border-radius: 6px;
    padding: 6px 8px; outline: none; }
  #sendInput:focus { border-color: var(--cyan); }
  #sendInput::placeholder { color: var(--faint); }

  /* right rail: members.
     🔑 NO status dot. The first version drew a 6px circle in each handle's own hash colour,
     which reads as a status light — Sub saw a red one and reasonably asked what it meant. It
     meant nothing. The NAME carries the colour instead, where a colour is obviously identity. */
  .mrow { display: flex; align-items: center; gap: 6px; padding: 3px 10px; font-size: 11.5px; }
  .mrow .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mrow .vf { flex: none; font-size: 8px; font-weight: 800; color: var(--green, #38d980); }
  .mrow.you .nm { color: var(--gold); font-weight: 700; }

  /* header (thin — the tabs carry the identity, so this stays out of the way) */
  .head { flex: none; display: flex; align-items: center; gap: 7px; padding: 6px 10px;
    border-bottom: 1px solid var(--divider); position: relative; z-index: 4; min-height: 34px; }
  .dia { width: 7px; height: 7px; flex: none; background: var(--faint); transform: rotate(45deg); transition: background 0.3s; }
  #panel.on .dia { background: var(--cyan-bright); box-shadow: 0 0 8px var(--cyan); }
  .h-title { font-size: 10px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: var(--cyan-dim); }
  #whoami { flex: 1; min-width: 0; font-size: 10.5px; color: var(--faint); overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .hbtn { font-family: var(--sans); font-size: 11px; font-weight: 600; letter-spacing: 0.04em;
    color: var(--cyan-bright); background: rgba(var(--accent-rgb), 0.14); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 10px; cursor: pointer; white-space: nowrap; }
  .hbtn:hover { background: rgba(var(--accent-rgb), 0.24); border-color: var(--cyan); }
  .hbtn.sm { padding: 3px 7px; font-size: 10px; }
  .hbtn.active { background: rgba(var(--accent-rgb), 0.28); border-color: var(--cyan); }
  /* 🔑 These were EMOJI (☰ / 👥). An emoji is painted by the OS colour font, so it ignores the
     manufacturer skin completely — on Sub's skin it came out purple, clashing and unreadable at
     this size. Inline SVG on `currentColor` takes the theme accent like every other control. */
  .hbtn.tog { min-width: 28px; display: inline-flex; align-items: center; justify-content: center;
    padding: 4px 6px; color: var(--cyan-dim); }
  .hbtn.tog svg, #emojiBtn svg { width: 13px; height: 13px; display: block; fill: none;
    stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .hbtn.tog:hover, .hbtn.tog.active { color: var(--cyan-bright); }
  #emojiBtn { display: inline-flex; align-items: center; justify-content: center;
    color: var(--cyan-dim); padding: 4px 7px; }
  #emojiBtn:hover, #emojiBtn.active { color: var(--cyan-bright); }

  /* identity gate */
  #gate { position: absolute; inset: 0; display: none; flex-direction: column; justify-content: center;
    gap: 10px; padding: 22px 18px; overflow-y: auto;
    background: linear-gradient(180deg, var(--panel-top), var(--panel-bot)); z-index: 5; }
  #panel.gated #gate { display: flex; }
  #gate .lbl { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); }
  #gate .hint { font-size: 11px; line-height: 1.6; color: var(--cyan-dim); }
  #handleInput { font-family: var(--sans); font-size: 14px; font-weight: 600; color: var(--cyan-bright);
    background: rgba(0, 0, 0, 0.25); border: 1px solid var(--border); border-radius: 7px;
    padding: 9px 10px; outline: none; width: 100%; }
  #handleInput:focus { border-color: var(--cyan); }
  #gate .row { display: flex; gap: 8px; align-items: center; }
  #gate .row .hbtn { flex: 1; text-align: center; padding: 8px 10px; }

  /* Narrow embeds (a user can drag this widget small): drop the rails rather than crush them. */
  @media (max-width: 520px) { #left, #right { display: none; } }
</style>
</head>
<body>
  <div id="panel" class="wpanel">
    <div class="head">
      <span class="dia"></span>
      <span class="h-title">Chat</span>
      <span id="whoami"></span>
      <button id="leftBtn" class="hbtn sm tog" type="button" title="Show or hide the channel list" aria-label="Channels">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
      </button>
      <button id="rightBtn" class="hbtn sm tog" type="button" title="Show or hide who's here" aria-label="Members">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="6" cy="5.5" r="2.5"/><path d="M1.5 13.5c0-2.5 2-4 4.5-4s4.5 1.5 4.5 4"/><path d="M11 3.6a2.5 2.5 0 0 1 0 4.3M12.4 9.9c1.4.5 2.3 1.8 2.3 3.6"/></svg>
      </button>
    </div>

    <div id="body">
      <div id="left" class="rail">
        <div class="rail-head">Channels</div>
        <div id="chanList" class="rail-body"></div>
        <div class="rail-foot">
          <input id="chanInput" type="text" placeholder="Channel name…" maxlength="30" spellcheck="false" autocomplete="off" />
          <div class="row">
            <button id="joinBtn" class="hbtn sm" type="button" title="Join an existing channel">Join</button>
            <button id="createBtn" class="hbtn sm" type="button" title="Create a new channel">Create</button>
          </div>
        </div>
      </div>

      <div id="center">
        <div id="tabs"></div>
        <div id="log"></div>
        <div id="sendbar">
          <input id="sendInput" type="text" placeholder="Say something…  (try :o7: or :thumbsup:)" maxlength="400" autocomplete="off" spellcheck="false" />
          <button id="emojiBtn" class="hbtn sm" type="button" title="Emoji" aria-label="Emoji">
            <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2"/><path d="M5.6 9.6a3 3 0 0 0 4.8 0"/><circle cx="6" cy="6.4" r=".9" fill="currentColor" stroke="none"/><circle cx="10" cy="6.4" r=".9" fill="currentColor" stroke="none"/></svg>
          </button>
          <button id="typeBtn" class="hbtn sm" type="button" title="Typing mode: grab keyboard focus so you can type in-game">✎</button>
          <button id="sendBtn" class="hbtn sm" type="button">Send</button>
          <div id="emojiPop"></div>
          <div id="slash"></div>
        </div>
      </div>

      <div id="right" class="rail">
        <div class="rail-head">Here <span id="memCount" class="n"></span></div>
        <div id="memList" class="rail-body"></div>
      </div>
    </div>

    <div id="ctx"></div>

    <div id="gate">
      <div class="lbl">Chat identity</div>
      <div class="hint">Chat is for <b>verified RSI accounts</b> — that's what keeps it moderated.
        Connect your subliminal.gg account in <b>Setup</b>, then verify your RSI handle on your
        profile at <b>subliminal.gg/blueprints</b>. Chat unlocks on its own once you're verified.</div>
      <div id="devIdRow" hidden>
        <div class="lbl" style="margin-top:6px">Dev identity (local server only)</div>
        <input id="handleInput" type="text" placeholder="Your RSI handle" maxlength="30" spellcheck="false" autocomplete="off" />
        <div class="row" style="margin-top:8px">
          <button id="gateTypeBtn" class="hbtn" type="button" title="Typing mode: grab keyboard focus so you can type in-game">✎ Type mode</button>
          <button id="gateSaveBtn" class="hbtn" type="button">Join chat</button>
        </div>
      </div>
    </div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const EMBEDDED = new URLSearchParams(location.search).has("embedded");
  if (EMBEDDED) document.body.classList.add("embedded");
  const host = () => (EMBEDDED && window.parent) ? window.parent.__chatHost : null;

  const MAX_ROWS = 250;
  // Group headings for the left rail, in the same order the tabs run.
  const GROUPS = [
    { kind: "global", title: "Universe" },
    { kind: "region", title: "Server" },
    { kind: "shard", title: "Shard" },
    { kind: "org", title: "Organisation" },
    { kind: "custom", title: "Your channels" },
  ];

  let view = null;
  let activeCh = "global";
  let unread = new Set();
  let es = null;

  // Rail visibility is a local preference (per machine, not per account).
  const railPref = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : v === "1"; } catch { return d; } };
  let showLeft = railPref("chatLeft", true);
  let showRight = railPref("chatRight", true);

  // ── rendering ────────────────────────────────────────────────────────────
  const atBottom = () => {
    const el = $("log");
    return el.scrollHeight - el.scrollTop - el.clientHeight < 40;
  };
  function append(node) {
    const el = $("log");
    const stick = atBottom();
    el.appendChild(node);
    while (el.childElementCount > MAX_ROWS) el.removeChild(el.firstChild);
    if (stick) el.scrollTop = el.scrollHeight;
  }
  function sys(text) {
    const d = document.createElement("div");
    d.className = "sys";
    d.textContent = text;
    append(d);
  }
  function handleColor(handle) {
    let h = 0;
    for (const c of handle) h = (h * 31 + c.codePointAt(0)) % 360;
    return `hsl(${h} 65% 70%)`;
  }
  // ── mentions, links and the message body ─────────────────────────────────
  // Rendered as NODES, never innerHTML: message text is other players' input, and the one
  // place it could become markup is the one place it must not.
  const MENTION_RE = /@([A-Za-z0-9._-]{3,30})/g;
  // Tokens the app itself writes when you use a slash command. `bp:` is a blueprint on the
  // site; `item:` is a starcitizen.tools lookup. Both survive as plain text for old clients.
  // A token carries the display text AND the id the link needs: [bp:Name|uuid],
  // [mission:Title|contractKey], [item:Name]. The id half is optional so an older client's
  // plain [bp:Name] still renders (it just links by name).
  // 🔑 The site's routes are /blueprints/<ITEM UUID> and /missions/<CONTRACT KEY> — NOT the
  // display name. Linking by name 404s, which is exactly what Sub hit.
  const TOKEN_RE = /\[(bp|item|mission):([^\]|]{1,80})(?:\|([^\]]{1,80}))?\]/g;
  const bpUrl = (id) => "https://subliminal.gg/blueprints/" + encodeURIComponent(id);
  const missionUrl = (key) => "https://subliminal.gg/missions/" + encodeURIComponent(key);
  // starcitizen.tools page titles are the item name with underscores for spaces
  // (verified: /Deadbolt_III_Cannon → 200).
  const toolsUrl = (name) => "https://starcitizen.tools/" + name.trim().replace(/\s+/g, "_").split("/").map(encodeURIComponent).join("/");
  function openLink(url) {
    if (host()?.openUrl) host().openUrl(url);
    else window.open(url, "_blank", "noopener");
  }
  // Blueprint names recognised on sight — no command needed (Sub, 2026-08-09). The list and the
  // "is it distinctive enough" judgement are the sidecar's (see autoLinkNames); this just
  // matches them. One regex, built once, longest-name-first so the longer of two overlapping
  // names wins. Word boundaries on both ends, so "Bolt" inside "Deadbolt" never matches.
  let bpRe = null;
  let bpCanon = new Map();   // matched text (lowercase) → the canonical blueprint name
  async function loadAutoLinks() {
    try {
      const d = await (await fetch("/api/blueprint-names")).json();
      const rows = (d.names ?? []).filter((r) => r && r.match);
      if (!rows.length) return;
      bpCanon = new Map(rows.map((r) => [r.match.toLowerCase(), { name: r.name, item: r.item }]));
      const esc = rows.map((r) => r.match.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
      bpRe = new RegExp("(?<![\\w-])(" + esc.join("|") + ")(?![\\w-])", "gi");
    } catch { /* no dataset yet — chat still works, just without auto-links */ }
  }
  /** Append `text`, turning any known blueprint name inside it into a link. */
  function appendLinkified(frag, text) {
    if (!bpRe) { frag.appendChild(document.createTextNode(text)); return; }
    bpRe.lastIndex = 0;
    let last = 0, m;
    while ((m = bpRe.exec(text))) {
      if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      const a = document.createElement("span");
      a.className = "lk";
      a.textContent = m[0];                                    // show what they typed…
      const canon = bpCanon.get(m[0].toLowerCase());           // …but link the real item's UUID
      a.title = !canon || canon.name === m[0]
        ? "Open this blueprint on subliminal.gg"
        : "Open “" + canon.name + "” on subliminal.gg";
      const url = bpUrl(canon?.item ?? m[0]);
      a.addEventListener("click", () => openLink(url));
      frag.appendChild(a);
      last = m.index + m[0].length;
    }
    if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
  }

  function renderBody(text) {
    const frag = document.createDocumentFragment();
    const me = (view?.you?.handle ?? "").toLowerCase();
    let mentionedMe = false;
    // One pass over both patterns, so a mention inside a token can't double-render.
    const parts = [];
    let idx = 0;
    const all = [];
    text.replace(TOKEN_RE, (m, kind, name, id, at) => { all.push({ at, len: m.length, kind, name, id }); return m; });
    text.replace(MENTION_RE, (m, handle, at) => { all.push({ at, len: m.length, kind: "at", name: handle }); return m; });
    all.sort((a, b) => a.at - b.at);
    for (const t of all) {
      if (t.at < idx) continue;                       // overlapping match — first one wins
      if (t.at > idx) parts.push({ text: text.slice(idx, t.at) });
      parts.push(t);
      idx = t.at + t.len;
    }
    if (idx < text.length) parts.push({ text: text.slice(idx) });
    for (const p of parts) {
      // Plain text is where auto-linking happens; an explicit [bp:…] token or an @mention is
      // already something, and must not be re-scanned into something else.
      if (p.text !== undefined) { appendLinkified(frag, p.text); continue; }
      if (p.kind === "at") {
        const s = document.createElement("span");
        const isMe = p.name.toLowerCase() === me;
        if (isMe) mentionedMe = true;
        s.className = "at" + (isMe ? " me" : "");
        s.textContent = "@" + p.name;
        frag.appendChild(s);
        continue;
      }
      const a = document.createElement("span");
      a.className = "lk";
      a.textContent = p.name;
      const url = p.kind === "mission" ? missionUrl(p.id ?? p.name)
        : p.kind === "bp" ? bpUrl(p.id ?? bpCanon.get(p.name.toLowerCase())?.item ?? p.name)
        : toolsUrl(p.name);
      a.title = p.kind === "mission" ? "Open this mission on subliminal.gg"
        : p.kind === "bp" ? "Open this blueprint on subliminal.gg"
        : "Look this up on starcitizen.tools";
      a.addEventListener("click", () => openLink(url));
      frag.appendChild(a);
    }
    return { frag, mentionedMe };
  }

  function msgRow(m) {
    const row = document.createElement("div");
    row.className = "msg";
    const ts = document.createElement("span");
    ts.className = "ts";
    try { ts.textContent = new Date(m.at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); } catch { /* bad ts */ }
    row.appendChild(ts);
    const who = m.from?.handle ?? "?";
    const nm = document.createElement("span");
    nm.className = "nm";
    nm.textContent = who;
    nm.style.color = handleColor(who);
    // Right-click a name in the log for the same menu as the member list.
    nm.addEventListener("contextmenu", (e) => { e.preventDefault(); openCtx(who, e.clientX, e.clientY); });
    row.appendChild(nm);
    if (m.from?.verified) {
      const v = document.createElement("span");
      v.className = "vf"; v.textContent = "✔"; v.title = "RSI-verified";
      row.appendChild(v);
    }
    const sep = document.createElement("span");
    sep.className = "sep"; sep.textContent = ":";
    row.appendChild(sep);
    const tx = document.createElement("span");
    tx.className = "tx";
    const body = renderBody(m.text);   // builds NODES — still no innerHTML anywhere
    tx.appendChild(body.frag);
    row.appendChild(tx);
    if (body.mentionedMe) row.classList.add("mention");
    return row;
  }

  // ── right-click a name: mention, friend, copy ────────────────────────────
  // Friends are a LOCAL list (this machine), not a server relationship — nothing to accept,
  // nothing to sync, and it can't leak who you fly with. It sorts them to the top of the
  // member list and marks them.
  const readFriends = () => { try { return JSON.parse(localStorage.getItem("chatFriends") || "[]"); } catch { return []; } };
  let friends = readFriends();
  const isFriend = (h) => friends.some((f) => f.toLowerCase() === h.toLowerCase());
  function toggleFriend(h) {
    friends = isFriend(h) ? friends.filter((f) => f.toLowerCase() !== h.toLowerCase()) : [...friends, h];
    try { localStorage.setItem("chatFriends", JSON.stringify(friends)); } catch { /* private mode */ }
    renderMembers();
  }
  function mention(handle) {
    const el = $("sendInput");
    const pad = el.value && !el.value.endsWith(" ") ? " " : "";
    el.value = el.value + pad + "@" + handle + " ";
    // 🔑 Focus only — NEVER switch typing mode on from a helper. Typing mode asks the shell for
    // a keyboard grab, and that grab makes the WHOLE canvas swallow clicks, so a mention or an
    // emoji pick would silently take the mouse away from the game and nothing turned it back off
    // (Sub, 2026-08-09: "the chat app is forcing me to click it"). The user turns it on
    // deliberately with the pencil, and the pencil turns it off.
    el.focus();
  }
  function closeCtx() { $("ctx").classList.remove("open"); }
  function openCtx(handle, clientX, clientY) {
    const ctx = $("ctx");
    ctx.textContent = "";
    const who = document.createElement("div");
    who.className = "ct-who"; who.textContent = handle;
    ctx.appendChild(who);
    const add = (label, fn) => {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = label;
      b.addEventListener("click", () => { closeCtx(); fn(); });
      ctx.appendChild(b);
    };
    add("Mention in chat", () => mention(handle));
    add(isFriend(handle) ? "Remove from friends" : "Add to friends", () => toggleFriend(handle));
    add("Open their profile", () => openLink("https://subliminal.gg/citizens/" + encodeURIComponent(handle)));
    // Position INSIDE the panel — this popover hangs over the message list, and a menu that
    // runs off the widget is a menu the shell never hit-tests.
    const box = $("panel").getBoundingClientRect();
    ctx.classList.add("open");
    const w = ctx.offsetWidth, h = ctx.offsetHeight;
    let x = clientX - box.left, y = clientY - box.top;
    if (x + w > box.width - 4) x = Math.max(4, box.width - w - 4);
    if (y + h > box.height - 4) y = Math.max(4, box.height - h - 4);
    ctx.style.left = x + "px";
    ctx.style.top = y + "px";
    try { host()?.summonCog?.(); } catch { /* not embedded */ }
  }

  const chans = () => view?.channels ?? [];
  const chanOf = (ch) => chans().find((c) => c.ch === ch) ?? null;

  function renderTabs() {
    const tabs = $("tabs");
    tabs.textContent = "";
    for (const c of chans()) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "tab" + (c.ch === activeCh ? " active" : "");
      b.textContent = c.label + (typeof c.count === "number" ? ` [${c.count}]` : "");
      if (unread.has(c.ch)) {
        const u = document.createElement("span");
        u.className = "unread";
        b.appendChild(u);
      }
      b.addEventListener("click", () => select(c.ch));
      tabs.appendChild(b);
    }
  }

  /* The left rail is BOTH your channel list and the browser for ones you could join —
     the same thing EVE splits across two windows, which is why it reads as one list here. */
  function renderChannels() {
    const list = $("chanList");
    list.textContent = "";
    for (const g of GROUPS) {
      const mine = chans().filter((c) => c.kind === g.kind);
      const avail = g.kind === "custom" ? (view?.directory ?? []) : [];
      if (!mine.length && !avail.length) continue;
      const h = document.createElement("div");
      h.className = "grp"; h.textContent = g.title;
      list.appendChild(h);
      for (const c of mine) {
        const row = document.createElement("div");
        row.className = "crow" + (c.ch === activeCh ? " on" : "");
        const nm = document.createElement("span");
        nm.className = "nm"; nm.textContent = c.label;
        row.appendChild(nm);
        if (typeof c.count === "number") {
          const ct = document.createElement("span");
          ct.className = "ct"; ct.textContent = String(c.count);
          row.appendChild(ct);
        }
        row.addEventListener("click", () => select(c.ch));
        // Only custom rooms can be left — the rest follow your log and your org.
        if (c.kind === "custom") {
          const x = document.createElement("span");
          x.className = "x"; x.textContent = "✕"; x.title = "Leave this channel";
          x.addEventListener("click", (e) => { e.stopPropagation(); leave(c.ch); });
          row.appendChild(x);
        }
        list.appendChild(row);
      }
      for (const d of avail) {
        const row = document.createElement("div");
        row.className = "crow";
        row.title = "Join " + d.label;
        const nm = document.createElement("span");
        nm.className = "nm"; nm.style.color = "var(--faint)"; nm.textContent = d.label;
        row.appendChild(nm);
        const ct = document.createElement("span");
        ct.className = "ct"; ct.textContent = String(d.count ?? 0);
        row.appendChild(ct);
        row.addEventListener("click", () => joinNamed(d.label, "join"));
        list.appendChild(row);
      }
    }
    if (!list.childElementCount) {
      const e = document.createElement("div");
      e.className = "empty";
      e.textContent = "No channels yet — they appear as you connect and fly.";
      list.appendChild(e);
    }
  }

  function renderMembers() {
    const list = $("memList");
    list.textContent = "";
    const c = chanOf(activeCh);
    const members = c?.members ?? [];
    $("memCount").textContent = c && typeof c.count === "number" ? String(c.count) : "";
    if (!members.length) {
      const e = document.createElement("div");
      e.className = "empty";
      e.textContent = c ? "Just you so far." : "";
      list.appendChild(e);
      return;
    }
    const me = (view?.you?.handle ?? "").toLowerCase();
    // You first, then friends, then everyone alphabetically.
    const rank = (h) => (h.toLowerCase() === me ? 0 : isFriend(h) ? 1 : 2);
    for (const m of [...members].sort((a, b) => rank(a.handle) - rank(b.handle) || a.handle.localeCompare(b.handle))) {
      const row = document.createElement("div");
      row.className = "mrow" + (m.handle.toLowerCase() === me ? " you" : "");
      row.addEventListener("contextmenu", (e) => { e.preventDefault(); openCtx(m.handle, e.clientX, e.clientY); });
      row.title = "Right-click for mention, friends and profile";
      const nm = document.createElement("span");
      nm.className = "nm"; nm.textContent = m.handle;
      // Same colour the name carries in the log, so a member list and its messages agree.
      if (m.handle.toLowerCase() !== me) nm.style.color = handleColor(m.handle);
      row.appendChild(nm);
      if (isFriend(m.handle)) {
        const f = document.createElement("span");
        f.className = "fav"; f.textContent = "★"; f.title = "Friend";
        row.appendChild(f);
      }
      if (m.verified) {
        const v = document.createElement("span");
        v.className = "vf"; v.textContent = "✔"; v.title = "RSI-verified";
        row.appendChild(v);
      }
      list.appendChild(row);
    }
  }

  function renderLog() {
    $("log").textContent = "";
    const c = chanOf(activeCh);
    if (!c) {
      if (view?.status === "connected") sys("Pick a channel on the left.");
      return;
    }
    for (const m of c.msgs) append(msgRow(m));
    $("log").scrollTop = $("log").scrollHeight;
  }

  function select(ch) {
    activeCh = ch;
    unread.delete(ch);
    renderTabs(); renderChannels(); renderMembers(); renderLog();
  }

  function applyRails() {
    $("panel").classList.toggle("no-left", !showLeft);
    $("panel").classList.toggle("no-right", !showRight);
    $("leftBtn").classList.toggle("active", showLeft);
    $("rightBtn").classList.toggle("active", showRight);
  }

  function renderAll() {
    const p = $("panel");
    p.classList.toggle("on", view?.status === "connected");
    p.classList.toggle("gated", view ? !view.hasIdentity : false);
    $("devIdRow").hidden = !view?.devServer;
    const you = view?.you;
    $("whoami").textContent = you ? you.handle : "";
    if (view && !chans().some((c) => c.ch === activeCh)) activeCh = chans()[0]?.ch ?? "global";
    applyRails();
    renderTabs(); renderChannels(); renderMembers(); renderLog();
    if (view?.status === "error" && view.error) sys(view.error);
    else if (view?.status === "connecting") sys("Connecting…");
    else if (view && view.status === "off" && view.hasIdentity) sys("Chat is off. Open the Chat widget on the overlay to connect.");
  }

  // ── live stream from the sidecar ─────────────────────────────────────────
  function listen() {
    if (es) es.close();
    es = new EventSource("/chat/events");
    es.onmessage = (e) => {
      let f;
      try { f = JSON.parse(e.data); } catch { return; }
      if (f.type === "state") { view = { ...(view ?? {}), ...f.view }; renderAll(); }
      else if (f.type === "msg") {
        const c = chanOf(f.msg.ch);
        if (c) { c.msgs.push(f.msg); if (c.msgs.length > MAX_ROWS) c.msgs.splice(0, c.msgs.length - MAX_ROWS); }
        // Being named is the one thing worth interrupting for — in ANY channel, whether or not
        // you are looking at it, and never for your own messages.
        const me = (view?.you?.handle ?? "").toLowerCase();
        const namesMe = me && new RegExp("@" + me.replace(/[.*+?^${}()|[\]\\-]/g, "\\$&") + "\\b", "i").test(f.msg.text);
        if (namesMe && (f.msg.from?.handle ?? "").toLowerCase() !== me) announceMention(f.msg.from?.handle ?? "Someone", f.msg.ch);
        if (f.msg.ch === activeCh) append(msgRow(f.msg));
        else { unread.add(f.msg.ch); renderTabs(); renderChannels(); }
      }
      else if (f.type === "presence") {
        const c = chanOf(f.ch);
        if (c) { c.count = f.count; if (Array.isArray(f.members)) c.members = f.members; }
        renderTabs(); renderChannels();
        if (f.ch === activeCh) renderMembers();
      }
      else if (f.type === "dir") { if (view) view.directory = (f.channels ?? []).filter((d) => !chanOf(d.ch)); renderChannels(); }
      else if (f.type === "notice") sys(f.text);
    };
    es.onerror = () => { /* EventSource retries on its own */ };
  }
  async function load() {
    try {
      view = await (await fetch("/api/chat", { cache: "no-store" })).json();
    } catch {
      view = null;
      sys("Couldn't reach the overlay service.");
    }
    renderAll();
    listen();
  }

  // ── emoji ────────────────────────────────────────────────────────────────
  // Curated rather than exhaustive: a full Unicode set is a scroll you never finish, and the
  // point here is the twenty you actually send while flying. SC-flavoured group first — o7 is
  // the salute every SC player types, so it earns the top-left slot.
  const EMOJI = [
    ["Verse", [["o7", "🫡"], ["ship", "🚀"], ["mining", "⛏️"], ["salvage", "🔧"], ["cargo", "📦"], ["money", "💰"],
               ["boom", "💥"], ["fire", "🔥"], ["skull", "💀"], ["medic", "🩺"], ["fuel", "⛽"], ["star", "⭐"]]],
    ["Reactions", [["yes", "👍"], ["thumbsup", "👍"], ["no", "👎"], ["ok", "👌"], ["wave", "👋"], ["clap", "👏"],
                   ["pray", "🙏"], ["muscle", "💪"], ["eyes", "👀"], ["brain", "🧠"], ["100", "💯"], ["check", "✅"]]],
    ["Faces", [["smile", "🙂"], ["grin", "😄"], ["joy", "😂"], ["wink", "😉"], ["cool", "😎"], ["think", "🤔"],
               ["sad", "🙁"], ["cry", "😭"], ["angry", "😠"], ["shock", "😱"], ["sweat", "😅"], ["shrug", "🤷"]]],
    ["Signals", [["warn", "⚠️"], ["sos", "🆘"], ["question", "❓"], ["bang", "❗"], ["clock", "⏰"], ["pin", "📍"],
                 ["up", "⬆️"], ["down", "⬇️"], ["left", "⬅️"], ["right", "➡️"], ["heart", "❤️"], ["party", "🎉"]]],
  ];
  /** :shortcode: → emoji, applied on send. Typing beats hunting a grid mid-flight. */
  const SHORTCODES = new Map(EMOJI.flatMap(([, rows]) => rows.map(([name, ch]) => [name, ch])));
  function expandShortcodes(text) {
    return text.replace(/:([a-z0-9_+-]{1,20}):/gi, (m, name) => SHORTCODES.get(name.toLowerCase()) ?? m);
  }
  function buildEmojiPicker() {
    const pop = $("emojiPop");
    for (const [group, rows] of EMOJI) {
      const h = document.createElement("div");
      h.className = "egrp"; h.textContent = group;
      pop.appendChild(h);
      const row = document.createElement("div");
      row.className = "erow";
      for (const [name, ch] of rows) {
        const b = document.createElement("button");
        b.type = "button"; b.textContent = ch; b.title = ":" + name + ":";
        b.addEventListener("click", () => insertEmoji(ch));
        row.appendChild(b);
      }
      pop.appendChild(row);
    }
  }
  function insertEmoji(ch) {
    const el = $("sendInput");
    // Insert at the CARET, not the end — an emoji mid-sentence is the common case.
    const s = el.selectionStart ?? el.value.length, e = el.selectionEnd ?? el.value.length;
    el.value = el.value.slice(0, s) + ch + el.value.slice(e);
    const at = s + ch.length;
    el.setSelectionRange(at, at);
    setEmojiPop(false);
    // Keep the keyboard grab: over a focused game, losing it sends the next keys to SC.
    // 🔑 Focus only — NEVER switch typing mode on from a helper. Typing mode asks the shell for
    // a keyboard grab, and that grab makes the WHOLE canvas swallow clicks, so a mention or an
    // emoji pick would silently take the mouse away from the game and nothing turned it back off
    // (Sub, 2026-08-09: "the chat app is forcing me to click it"). The user turns it on
    // deliberately with the pencil, and the pencil turns it off.
    el.focus();
  }
  function setEmojiPop(on) {
    $("emojiPop").classList.toggle("open", !!on);
    $("emojiBtn").classList.toggle("active", !!on);
    // The popover hangs OUTSIDE the widget's own box, so the shell must be told to hit-test it
    // or it is unclickable over the game (the clipping/RSEL trap every widget chrome hits).
    try { host()?.summonCog?.(); } catch { /* not embedded */ }
  }

  // ── being mentioned ──────────────────────────────────────────────────────
  // HAL says it, because that is this app's voice everywhere else (mining call-outs, SC Feed).
  // The clip is `c_mentioned.ogg`; if it is not bundled yet the browser voice reads the same
  // line, so the feature works today and simply gets better when the clip lands — the same
  // fallback the mining call-outs use for a missing clip.
  // Two clips, stitched: "You have been mentioned in" + the CHANNEL. Same shape as the mining
  // call-outs (a sentence clip plus a name clip) — see references/ocr.md.
  // 🔑 The region is named but its DIGITS are not (Sub: "you don't have to mention the number"),
  // and the shard is just "your shard" — you can only be in one at a time, so the number tells
  // you nothing you don't already know. The region families are the ones actually seen in 480
  // shared logs: US East, EU West, Asia-Pacific East, Asia-Pacific SE (plus the rest of CIG's
  // scheme, in case a region appears that nobody has shared a log from yet).
  const play = (src) => new Promise((res) => {
    const a = new Audio(src);
    a.onended = res; a.onerror = res;
    a.play().catch(res);
  });
  function channelClip(ch) {
    const c = chanOf(ch);
    if (!c) return "n_ch_global";
    if (c.kind === "global") return "n_ch_global";
    if (c.kind === "shard") return "n_ch_shard";
    if (c.kind === "org") return "n_ch_org";
    if (c.kind === "custom") return "n_ch_custom";
    // region: name the family, never the digits
    const fam = (view?.region ?? "").toLowerCase().match(/^([a-z]+?)\d/);
    return fam ? "n_ch_" + fam[1] : "n_ch_region";
  }
  async function announceMention(from, ch) {
    const clip = channelClip(ch);
    try {
      const r = await fetch("/tts/" + clip + ".ogg", { method: "HEAD" });
      if (r.ok) {
        await play("/tts/c_mentionedin.ogg");
        await play("/tts/" + clip + ".ogg");
        return;
      }
    } catch { /* fall through to the browser voice */ }
    try {
      const where = chanOf(ch)?.label ?? "chat";
      const u = new SpeechSynthesisUtterance("You have been mentioned in " + where);
      u.rate = 0.9; u.pitch = 0.7;   // HAL is slow and low; the nearest a system voice gets
      speechSynthesis.speak(u);
    } catch { /* no speech engine — the gold highlight still marks it */ }
  }

  // ── slash commands ───────────────────────────────────────────────────────
  // They rewrite what you SEND into a token the renderer turns into a link, so the message
  // still reads as plain text for anyone on an older build. Kept deliberately short: these
  // are typed mid-flight, one-handed.
  const COMMANDS = [
    { cmd: "/bp", args: "<blueprint>", hint: "link a blueprint on subliminal.gg",
      run: (rest) => rest ? "[bp:" + rest + "]" : null },
    { cmd: "/item", args: "<item>", hint: "look it up on starcitizen.tools",
      run: (rest) => rest ? "[item:" + rest + "]" : null },
    { cmd: "/mission", args: "<mission>", hint: "link a mission on subliminal.gg",
      run: (rest) => rest ? "[mission:" + rest + "]" : null },
    { cmd: "/me", args: "<action>", hint: "speak in the third person",
      run: (rest) => rest ? "* " + (view?.you?.handle ?? "") + " " + rest : null },
    { cmd: "/shrug", args: "", hint: "¯\\_(ツ)_/¯", run: () => "¯\\_(ツ)_/¯" },
  ];
  /** Expand a leading slash command. Returns the text to send, or null to refuse. */
  function applyCommand(text) {
    // /me and /shrug rewrite the WHOLE message, so they only count at the very start.
    if (/^\/(me|shrug)\b/i.test(text)) {
      const sp = text.indexOf(" ");
      const name = (sp < 0 ? text : text.slice(0, sp)).toLowerCase();
      const rest = sp < 0 ? "" : text.slice(sp + 1).trim();
      const c = COMMANDS.find((x) => x.cmd === name);
      const out = c?.run(rest);
      if (!out) { sys(c.cmd + " needs something after it - " + c.cmd + " " + c.args); return null; }
      return out;
    }
    // 🔑 The link commands are INLINE and are normally turned into a token by accepting a
    // suggestion. A leftover "/bp something" — typed and sent without picking — is expanded
    // here so it still links rather than being sent as literal slash text. Anywhere in the
    // message, any number of times.
    let out = text.replace(/(^|\s)\/(bp|item|mission)\s+([^[\]]+?)(?=\s\/|$)/gi, (m, pre, kind, rest) => {
      const k = kind.toLowerCase();
      const name = rest.trim();
      if (!name) return m;
      if (k === "bp") {
        const hit = bpCanon.get(name.toLowerCase());
        return pre + "[bp:" + (hit?.name ?? name) + (hit?.item ? "|" + hit.item : "") + "]";
      }
      if (k === "item") return pre + "[item:" + name + "]";
      return pre + "[mission:" + name + "]";   // no key: the site resolves what it can
    });
    // An unknown slash word at the very start is a typo worth naming, not silent plain text.
    if (/^\//.test(out) && !/^\[/.test(out)) {
      const first = out.split(/\s/)[0].toLowerCase();
      if (!COMMANDS.some((c) => c.cmd === first)) {
        sys("No command called " + first + ". Try " + COMMANDS.map((c) => c.cmd).join(", ") + ".");
        return null;
      }
    }
    return out;
  }
  // ── autocomplete ─────────────────────────────────────────────────────────
  // Sub's ask: "I don't know exactly what to type." So every place a NAME is expected — a
  // person after @, a blueprint after /bp, an item after /item — suggests as you type, and the
  // command list itself completes. `sugg` is the current list; `suggAt` is where in the input
  // the replacement starts, so accepting rewrites only the token being typed.
  let sugg = [];
  let suggIx = 0;
  let suggAt = 0;
  let bpTimer = null;

  function closeSugg() { $("slash").classList.remove("open"); sugg = []; }

  function drawSugg(rows, startAt) {
    const box = $("slash");
    sugg = rows; suggAt = startAt; suggIx = 0;
    box.textContent = "";
    if (!rows.length) { box.classList.remove("open"); return; }
    rows.forEach((row, i) => {
      const r = document.createElement("div");
      r.className = "sc-row" + (i === 0 ? " on" : "");
      const a = document.createElement("span");
      a.className = row.mono ? "sc-cmd" : "sc-name";
      a.textContent = row.label;
      r.appendChild(a);
      if (row.hint) {
        const b = document.createElement("span");
        b.className = "sc-hint"; b.textContent = row.hint;
        r.appendChild(b);
      }
      r.addEventListener("mousedown", (e) => { e.preventDefault(); acceptSugg(i); });
      box.appendChild(r);
    });
    box.classList.add("open");
    try { host()?.summonCog?.(); } catch { /* not embedded */ }
  }

  function moveSugg(by) {
    if (!sugg.length) return;
    suggIx = (suggIx + by + sugg.length) % sugg.length;
    [...$("slash").children].forEach((el, i) => el.classList.toggle("on", i === suggIx));
    $("slash").children[suggIx]?.scrollIntoView({ block: "nearest" });
  }

  function acceptSugg(i) {
    const row = sugg[i ?? suggIx];
    if (!row) return;
    const el = $("sendInput");
    el.value = el.value.slice(0, suggAt) + row.insert;
    closeSugg();
    // 🔑 Focus only — NEVER switch typing mode on from a helper. Typing mode asks the shell for
    // a keyboard grab, and that grab makes the WHOLE canvas swallow clicks, so a mention or an
    // emoji pick would silently take the mouse away from the game and nothing turned it back off
    // (Sub, 2026-08-09: "the chat app is forcing me to click it"). The user turns it on
    // deliberately with the pencil, and the pencil turns it off.
    el.focus();
    // A command still needs its argument, so re-run the pass to offer the next thing.
    renderSlash(el.value);
  }

  /** Who is in the channel you are looking at — the only people worth suggesting. */
  const channelHandles = () => (chanOf(activeCh)?.members ?? []).map((m) => m.handle);

  function renderSlash(text) {
    const caretToken = (re) => {
      const m = text.match(re);
      return m ? { frag: m[1] ?? "", at: m.index ?? 0 } : null;
    };
    // 1. a command being typed (only at the very start, before any space)
    if (/^\/\S*$/.test(text)) {
      const matches = COMMANDS.filter((c) => c.cmd.startsWith(text.toLowerCase()));
      drawSugg(matches.map((c) => ({
        label: c.cmd + (c.args ? " " + c.args : ""), hint: c.hint, mono: true,
        insert: c.cmd + (c.args ? " " : ""),
      })), 0);
      return;
    }
    // 2. a blueprint / item / mission name after its command — asked of the local dataset.
    // 🔑 Matched ANYWHERE in the message, not just at the start (Sub: "type a message
    // afterwards, or maybe even in the middle"). Accepting a suggestion replaces the command
    // fragment IN PLACE with a finished token, so you carry on typing around it.
    const bp = text.match(/(?:^|\s)\/(bp|item|mission)\s+([^/]*)$/i);
    if (bp) {
      const kind = bp[1].toLowerCase();
      const frag = bp[2];
      const start = text.length - frag.length - bp[1].length - 2;   // back over "/cmd "
      clearTimeout(bpTimer);
      if (frag.trim().length < 2) { closeSugg(); return; }
      bpTimer = setTimeout(async () => {
        try {
          if (kind === "mission") {
            const d = await (await fetch("/api/mission-search?q=" + encodeURIComponent(frag))).json();
            const rows = d.missions ?? [];
            if (!rows.length) { closeSugg(); return; }
            drawSugg(rows.map((m) => ({
              label: m.title, mono: false, hint: "subliminal.gg",
              insert: "[mission:" + m.title + "|" + m.key + "] ",
            })), start);
            return;
          }
          const d = await (await fetch("/api/blueprint-search?q=" + encodeURIComponent(frag))).json();
          const rows = d.names ?? [];
          if (!rows.length) { closeSugg(); return; }
          drawSugg(rows.map((r) => ({
            label: r.name, mono: false,
            hint: kind === "bp" ? "subliminal.gg" : "starcitizen.tools",
            // The blueprint link needs the item UUID (the site's route); the wiki link needs
            // only the name, and its page title is the name with underscores.
            insert: kind === "bp"
              ? "[bp:" + r.name + "|" + r.item + "] "
              : "[item:" + r.name + "] ",
          })), start);
        } catch { closeSugg(); }
      }, 120);   // debounce: this fires on every keystroke
      return;
    }
    // 3. someone's name after @ — from the members actually in this channel
    const at = text.match(/(?:^|\s)@([A-Za-z0-9._-]*)$/);
    if (at) {
      const frag = (at[1] ?? "").toLowerCase();
      const start = text.length - frag.length - 1;   // include the "@"
      const pool = channelHandles().filter((h) => h.toLowerCase() !== (view?.you?.handle ?? "").toLowerCase());
      const hits = pool.filter((h) => h.toLowerCase().startsWith(frag)).slice(0, 8);
      if (!hits.length) { closeSugg(); return; }
      drawSugg(hits.map((h) => ({
        label: h, mono: false, hint: isFriend(h) ? "friend" : "", insert: "@" + h + " ",
      })), start);
      return;
    }
    closeSugg();
  }

  // ── actions ──────────────────────────────────────────────────────────────
  async function post(path, body) {
    try {
      const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      const d = await r.json().catch(() => null);
      if (!r.ok || !d?.ok) { sys(d?.message || "That didn't work."); return false; }
      return true;
    } catch {
      sys("Couldn't reach the overlay service.");
      return false;
    }
  }
  async function send() {
    const el = $("sendInput");
    const raw = el.value.trim();
    if (!raw) return;
    if (!chanOf(activeCh)) { sys("Not in a channel yet."); return; }
    const commanded = applyCommand(raw);
    if (commanded === null) { el.value = ""; $("slash").classList.remove("open"); return; }
    const text = expandShortcodes(commanded);
    el.value = "";
    setEmojiPop(false);
    $("slash").classList.remove("open");
    if (!await post("/api/chat/send", { ch: activeCh, text })) el.value = raw;
  }
  async function joinNamed(name, mode) {
    const n = (name ?? "").trim();
    if (!n) { $("chanInput").focus(); return; }
    if (await post("/api/chat/join", { name: n, mode })) $("chanInput").value = "";
  }
  function leave(ch) { void post("/api/chat/leave", { ch }); }

  // ── identity gate (dev builds only; production uses the verified account) ──
  async function saveHandle() {
    const h = $("handleInput").value.trim();
    if (!/^[A-Za-z0-9._-]{3,30}$/.test(h)) { $("handleInput").focus(); return; }
    if (typing) setTyping(false);
    try {
      await fetch("/api/config", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ chatHandle: h }),
      });
    } catch { sys("Couldn't reach the overlay service."); return; }
    load();
  }

  // ── typing mode (shared shell keyboard grab, same as Journal / Twitch Chat) ──
  let typing = false;
  let typingField = "send"; // which field the grab was requested for
  function setTyping(on, field) {
    typing = !!on;
    if (field) typingField = field;
    $("typeBtn").classList.toggle("active", typing);
    $("gateTypeBtn").classList.toggle("active", typing);
    $("gateTypeBtn").textContent = typing ? "✓ Done" : "✎ Type mode";
    if (typing) { if (host()) host().editStart(); else focusField(); }
    else { if (host()) host().editEnd(); const a = document.activeElement; if (a && a.blur) a.blur(); }
  }
  function focusField() {
    if ($("panel").classList.contains("gated")) { $("handleInput").focus(); return; }
    ($(typingField === "chan" ? "chanInput" : "sendInput")).focus();
  }
  window.__chatFocus = () => { if (typing) focusField(); };
  window.__chatExitTyping = () => { if (typing) setTyping(false); };

  $("sendBtn").addEventListener("click", send);
  $("sendInput").addEventListener("keydown", (e) => {
    // While suggestions are up the arrows/Tab/Enter drive THEM — Enter only sends once the
    // list is dismissed, so accepting a name can never fire the message by accident.
    if (sugg.length && $("slash").classList.contains("open")) {
      if (e.key === "ArrowDown") { e.preventDefault(); moveSugg(1); return; }
      if (e.key === "ArrowUp") { e.preventDefault(); moveSugg(-1); return; }
      if (e.key === "Tab" || e.key === "Enter") { e.preventDefault(); acceptSugg(); return; }
    }
    if (e.key === "Enter") { e.preventDefault(); send(); }
  });
  $("sendInput").addEventListener("input", () => renderSlash($("sendInput").value));
  $("emojiBtn").addEventListener("click", () => setEmojiPop(!$("emojiPop").classList.contains("open")));
  $("typeBtn").addEventListener("click", () => setTyping(!typing, "send"));
  $("joinBtn").addEventListener("click", () => joinNamed($("chanInput").value, "join"));
  $("createBtn").addEventListener("click", () => joinNamed($("chanInput").value, "create"));
  $("chanInput").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); joinNamed($("chanInput").value); } });
  // Clicking into a field over the game needs the shell's keyboard grab, or the keystrokes
  // reach Star Citizen instead.
  $("chanInput").addEventListener("focus", () => { if (!typing) setTyping(true, "chan"); });
  $("gateTypeBtn").addEventListener("click", () => setTyping(!typing));
  $("gateSaveBtn").addEventListener("click", saveHandle);
  $("handleInput").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); saveHandle(); } });
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    // Escape closes the picker first, THEN typing mode — otherwise dismissing the grid also
    // drops the keyboard grab and the next keystroke reaches the game.
    if ($("ctx").classList.contains("open")) { e.preventDefault(); closeCtx(); return; }
    if ($("slash").classList.contains("open")) { e.preventDefault(); $("slash").classList.remove("open"); return; }
    if ($("emojiPop").classList.contains("open")) { e.preventDefault(); setEmojiPop(false); return; }
    if (typing) { e.preventDefault(); setTyping(false); }
  });
  // Clicking anywhere else closes the picker (it hangs over the message list).
  document.addEventListener("pointerdown", (e) => {
    if ($("ctx").classList.contains("open") && !e.target.closest("#ctx")) closeCtx();
    if (!$("emojiPop").classList.contains("open")) return;
    if (e.target.closest("#emojiPop") || e.target.closest("#emojiBtn")) return;
    setEmojiPop(false);
  });

  $("leftBtn").addEventListener("click", () => {
    showLeft = !showLeft;
    try { localStorage.setItem("chatLeft", showLeft ? "1" : "0"); } catch { /* private mode */ }
    applyRails();
  });
  $("rightBtn").addEventListener("click", () => {
    showRight = !showRight;
    try { localStorage.setItem("chatRight", showRight ? "1" : "0"); } catch { /* private mode */ }
    applyRails();
  });

  // Any interaction summons the parent's global cog (settings/arrange reachable), matching mining.
  document.addEventListener("pointerdown", () => { try { host()?.summonCog?.(); } catch { /* not embedded */ } });

  applyRails();
  buildEmojiPicker();
  loadAutoLinks();
  load();
  try { host()?.ready?.(); } catch { /* not embedded */ }
</script>
</body>
</html>
